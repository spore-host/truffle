name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover.
# Belt-and-suspenders to the orion runner's /home/runner/.env (spore-host#345);
# this also covers GitHub-hosted fallback runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      # Formatting gate. Runs first because it's the cheapest check and the
      # fastest to act on. CI had no formatting check at all, and `make fmt`
      # rewrites files and always succeeds, so nothing gated formatting: 7 files
      # sat unformatted on main and surfaced as unrelated diffs in whatever PR
      # ran the formatter next (#122).
      - name: Format gate
        run: make check-fmt

      # The half of pin hygiene that needs the network, so it can't live in the
      # (hermetic) Go test suite: does each pin's `# vX.Y.Z` comment actually name
      # the tag its SHA carries? A wrong label is worse than none — it makes a
      # major-version jump read as a routine same-line bump, which is exactly how
      # this repo's own checkout pin sat labelled `# v6` while the SHA was really
      # v6.0.3. Read-only (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -coverprofile=coverage.out ./...

      - name: Coverage gate
        env:
          # Ratchet floor — must not drop below this. Raise it as coverage
          # improves; target is 60% (see CLAUDE.md), now met. Current: ~61.2%.
          MIN_COVERAGE: '58'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Vet
        run: go vet ./...

      # Docs drift gate: the committed command/flag reference (docs-gen/) is
      # generated from the CLI via `gen-docs`. Regenerate and fail if it's stale,
      # so a flag/command change can't merge without its reference update.
      - name: Docs reference drift gate
        run: make check-docs
